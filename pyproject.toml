[project]
name = "jepa-ipomdp"
version = "0.1.0"
description = "Recurrent JEPA belief filter with belief-tree MCTS for POMDPs and I-POMDPs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markupsafe==2.1.5",
    "torch>=2.5.0",
    "tqdm>=4.67.0",
    "networkx>=3.6.1",
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
    "plotly>=6.6.0",
    "tensorboard>=2.20.0",
    "hydra-core>=1.3.3",
    "omegaconf>=2.3.1",
    "psutil>=7.0.0",
    "pyyaml>=6.0"
]

[dependency-groups]
dev = ["pytest>=9.1.1"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# Two opt-in markers are excluded from the default run:
#   slow:   the certified infinite-horizon Tiger solve, the exact-model planner against the optimum and the GPU
#           world-model acceptance tests (about 23 min); `uv run pytest -m slow`.
#   golden: bit-identity fingerprints against tests/golden/fingerprints (about 1 min; torch-build and machine
#           specific, so they gate code changes on the project machine); `uv run pytest -m golden`.
addopts = "-m 'not slow and not golden'"
markers = ["slow: long exact-solver checks and the GPU acceptance tests; run with -m slow",
           "golden: bit-identity fingerprints of the training paths; run with -m golden"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
