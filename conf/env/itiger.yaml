# @package _global_
# ABSOLUTE PATH: conf/env/itiger.yaml
# ==============================================================================
# TWO-AGENT TIGER AS A FINITELY NESTED I-POMDP (Gmytrasiewicz & Doshi 2005, Section 7.1)
# ==============================================================================
#
# DESIGN DECISIONS:
# 1. The Learning Agent Is Agent i at a Declared Level:
#    - The joint tables are Table 1 of the paper (src/ipomdp/domain/multiagent_tiger.py); configuration only picks
#      agent i's strategy level and the discount. Agent i's problem is the fold of agent j's level-(level-1)
#      controller into i's view (src/ipomdp/domain/interactive.py): a FinitePOMDP over (tiger side, j's controller
#      node, j's last action), whose sizes the training run derives at start-up like every other domain.
#    - Level 0 is the paper's noise model (the other agent opens each door with probability 0.1, listens with 0.8).
#      Every lower level's controller is extracted from a bracket of width controller_epsilon and certified by a
#      bracket of width bracket_epsilon (src/ipomdp/domain/interactive.py, section 6). The controller is part of the
#      definition of agent i's problem, so both are domain parameters, saved with every run.
#    - controller_epsilon 0.5 (design decision for the interactive experiments): j's level-0 controller has 11
#      reachable, minimal nodes, and i's level-1 fold has 26 states. It is certified within 0.050 of j's optimum.
#      Extraction at 0.05 gives a 38-node controller with a slightly lower value and an 80-state fold.
#    - level: 2 folds j's level-1 controller instead. No tight bracket of j's level-1 problem exists to extract it
#      from, so it is the best member of a declared family of growl counters by exact evaluation
#      (src/ipomdp/domain/interactive.py, section 7): 5 nodes, exact value 15.3567 where j's optimum lies in
#      [16.55, 19.67]. i's level-2 fold has 14 states. bracket_epsilon and controller_epsilon then act on level 0
#      only, which sits at the bottom of the chain as i's own level-0 controller.
# 2. Episodes and Discount as in the Canonical Tiger:
#    - 100-step windows and gamma = 0.95, so returns compare with the single-agent benchmark's protocol; the game
#      continues after a door is opened (the tiger is re-placed), as in Table 1.
# ==============================================================================

env:
  name: itiger
  max_steps: 100              # Steps per episode window, as the canonical Tiger
  discount: 0.95              # gamma of agent i's problem and of every level below it
  level: 1                    # agent i's strategy level l >= 1; j is modelled at l - 1
  bracket_epsilon: 0.05       # certified bracket width of every level below l (certifies j's controller)
  controller_epsilon: 0.5     # bracket width j's controller is extracted from (defines j's controller)
